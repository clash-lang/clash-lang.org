  --series-1: #2a78d6;
  --series-2: #eb6834;
  --branch: #1baf7a;
  --border: rgba(11,11,11,0.10);
}
@media (prefers-color-scheme: dark) {
  .clash-bench-figure:not([data-theme="light"] *) {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --branch: #199e70;
    --border: rgba(255,255,255,0.10);
  }
}
[data-theme="dark"] .clash-bench-figure {
  --surface-1: #1a1a19;
  --page: #0d0d0d;
  --ink-1: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --series-1: #3987e5;
  --series-2: #d95926;
  --branch: #199e70;
  --border: rgba(255,255,255,0.10);
}
.clash-bench-figure text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.clash-bench-figure .title { font-size: 13px; font-weight: 650; fill: var(--ink-1); }
.clash-bench-figure .sub { font-size: 10.5px; fill: var(--muted); }
.clash-bench-figure .legend { font-size: 11px; fill: var(--ink-2); }
.clash-bench-figure .endlabel { font-size: 11px; font-weight: 600; fill: var(--ink-2); }
.clash-bench-figure .branchlabel { font-size: 10.5px; font-weight: 600; fill: var(--ink-2); }
.clash-bench-figure .marklabel { font-size: 10.5px; font-weight: 600; fill: var(--ink-2); }
.clash-bench-figure a text { text-decoration: underline; }
</style>
